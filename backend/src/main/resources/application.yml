spring:
  application:
    name: memora-api
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/memora}
    username: ${DB_USERNAME:memora}
    password: ${DB_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:105MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: MEMORA_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

memora:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    post-login-redirect: ${FRONTEND_POST_LOGIN_REDIRECT:http://localhost:3000/}
    login-error-redirect: ${FRONTEND_LOGIN_ERROR_REDIRECT:http://localhost:3000/login}
  security:
    csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:memora-local}
    access-key: ${STORAGE_ACCESS_KEY:local-development-only}
    secret-key: ${STORAGE_SECRET_KEY:local-development-only}
  media:
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:15728640}
    max-audio-bytes: ${MEDIA_MAX_AUDIO_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:104857600}
    orphan-retention: ${MEDIA_ORPHAN_RETENTION:PT24H}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
